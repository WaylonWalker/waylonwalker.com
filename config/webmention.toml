[markata-go.head]
[[markata-go.head.link]]
rel = "webmention"
href = "https://webmention.io/waylonwalker.com/webmention"

[[markata-go.head.text]]
value = """
<style>
.share-panel {
  margin: var(--space-8, 2rem) 0 var(--space-6, 1.5rem);
  padding-top: var(--space-4, 1rem);
  border-top: 1px solid var(--color-border, #e1e1e1);
}

.share-panel__title {
  font-size: var(--text-sm, 0.95rem);
  font-weight: 600;
  margin: 0 0 0.75rem;
}

.share-buttons,
.share-panel__grid {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: var(--space-4, 1rem);
}

.share-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 2.2rem;
  height: 2.2rem;
  padding: 0;
  background: transparent;
  border-radius: 999px;
  border: 1px solid var(--color-border, #d0d0d0);
  color: var(--color-text, currentColor);
  cursor: pointer;
  text-decoration: none;
  transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
}

.share-button__icon {
  width: 1.1rem;
  height: 1.1rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.share-button__icon svg {
  width: 100%;
  height: 100%;
  display: block;
}

.share-button__label,
.share-button__name {
  display: none;
}

.share-button__hint {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.share-button:hover,
.share-button:focus-visible {
  color: var(--color-primary, #4f46e5);
  border-color: var(--color-primary, #4f46e5);
  background: color-mix(in srgb, var(--color-primary, #4f46e5) 12%, var(--color-surface, #ffffff));
}

.share-button--copied {
  color: var(--color-primary, #4f46e5);
  border-color: var(--color-primary, #4f46e5);
  background: color-mix(in srgb, var(--color-primary, #4f46e5) 16%, transparent);
}
</style>
"""

[[markata-go.head.text]]
value = """
<style>
@font-face {
  font-family: "Source Sans 3 Fallback";
  src: local("Arial");
  size-adjust: 90.48%;
  ascent-override: 113.17%;
  descent-override: 44.21%;
  line-gap-override: 0%;
}
html[data-fontpack="handwritten"],
html[data-fontpack="dry-brush"],
html[data-fontpack="field-notebook"],
html[data-fontpack="marker-note"],
html[data-fontpack="painted-sign"] {
  --font-body: "Source Sans 3", "Source Sans 3 Fallback", system-ui,
    -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
</style>
"""

[markata-go.webmention]
enabled = true
endpoint = "https://webmention.io/waylonwalker.com/webmention"

[markata-go.webmentions]
enabled = true
outgoing = true
cache_dir = ".markata-cache/webmentions"
concurrent_requests = 5
timeout = "30s"
webmention_io_token = "${WEBMENTION_IO_TOKEN}"

# Temporary production guard for runtime-only drawer states. The current
# Markata CSS purge omits .sidebar--pinned because it appears only after JS
# opens the drawer. Inline critical CSS is not purged, and costs <1 KiB until
# markata#1711 is published and the site is rebuilt with its corrected engine.
[[markata-go.head.text]]
value = """
<style>
.feed-sidebar.sidebar--pinned,
.doc-sidebar.sidebar--pinned,
.content-sidebar.sidebar--pinned {
  visibility: visible;
  transform: none;
  transition-delay: 0s;
}
.feed-sidebar.feed-sidebar--expanded .feed-nav-drawer {
  max-height: 12rem;
  opacity: 1;
}
@media (min-width: 1201px) {
  .page-wrapper:has(> .feed-sidebar--left.sidebar--pinned) { --push-left: var(--feed-sidebar-width, 250px); }
  .page-wrapper:has(> .doc-sidebar--left.sidebar--pinned) { --push-left: var(--doc-sidebar-width, 250px); }
  .page-wrapper:has(> .content-sidebar--left.sidebar--pinned) { --push-left: var(--content-sidebar-width, 340px); }
  .page-wrapper:has(> .feed-sidebar--right.sidebar--pinned) { --push-right: var(--feed-sidebar-width, 250px); }
  .page-wrapper:has(> .doc-sidebar--right.sidebar--pinned) { --push-right: var(--doc-sidebar-width, 250px); }
  .page-wrapper:has(> .content-sidebar--right.sidebar--pinned) { --push-right: var(--content-sidebar-width, 340px); }
}
</style>
"""
