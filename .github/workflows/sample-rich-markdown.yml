name: Sample rich Markdown fixture

on:
  pull_request:
    paths:
      - "pages/sample.md"
      - "scripts/check-sample-rich-markdown.mjs"
      - ".github/workflows/sample-rich-markdown.yml"
  push:
    branches: [main]
    paths:
      - "pages/sample.md"
      - "scripts/check-sample-rich-markdown.mjs"
      - ".github/workflows/sample-rich-markdown.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate sample source
        run: node scripts/check-sample-rich-markdown.mjs
