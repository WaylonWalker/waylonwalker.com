[markata-go.theme]
palette = "ayu-dark"
palette_light = "ayu-light"
palette_dark = "ayu-dark"
fallback_mode = "dark"
aesthetic = "balanced"
fontpack = "handwritten"
text_size = "x-large"

[markata-go.theme.texture]
kind = "screenprint"
color_mix = 0.045
scale = 1.0
scope = "all"

[markata-go.theme.heading_texture]
kind = "splatter"
color_mix = 0.22
scale = 0.65

[markata-go.theme.motif]
kind = "block-w"
color_mix = 0.012
size = "72px"
gap = "32px"
row_offset = 0.26
wobble = 0.55
scatter = 0.75
layer = "over"
color = "muted"

[markata-go.theme.variables]
"--content-width" = "clamp(56ch, 60vw, 72ch)"
"--text-base" = "1.2rem"
